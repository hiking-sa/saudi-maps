name: تجربة الاتصال بـ R2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/r2-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: رفع ملف تجربة وقراءة المخزن
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          EP: ${{ secrets.R2_ENDPOINT }}
        run: |
          EP=$(echo "$EP" | tr -d '[:space:]'); EP=${EP%/}; EP=${EP%/saudi-maps}
          echo "طول المفتاح: ${#AWS_ACCESS_KEY_ID} / السر: ${#AWS_SECRET_ACCESS_KEY}"
          echo "ok $(date -u +%FT%TZ)" > hello.txt
          aws s3 cp hello.txt s3://saudi-maps/test/hello.txt --endpoint-url "$EP"
          aws s3 ls s3://saudi-maps/test/ --endpoint-url "$EP"
          echo "✅ الاتصال بـ R2 شغال"
