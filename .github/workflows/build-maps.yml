name: تجهيز خرائط المناطق
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "المناطق (مفصولة بمسافة) أو all"
        default: "asir"
  push:
    paths: ['.github/workflows/build-maps.yml', 'scripts/**']
  schedule:
    - cron: "17 2 3 * *"   # كل شهر يوم 3 الساعة 5:17 الفجر بتوقيت السعودية
concurrency: { group: maps, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      REGIONS: ${{ github.event.inputs.regions || (github.event_name == 'push' && 'asir') || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: تجهيز الأدوات
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool jq >/dev/null
          curl -sSL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          U=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest | jq -r '.assets[]|select(.name|test("Linux_x86_64"))|.browser_download_url')
          curl -sSL "$U" | tar xz pmtiles && ./pmtiles version || true
          EP="${{ secrets.R2_ENDPOINT }}"; EP=$(echo "$EP" | tr -d '[:space:]'); EP=${EP%/}; EP=${EP%/saudi-maps}; echo "EP=$EP" >> $GITHUB_ENV
      - name: تحميل بيانات OpenStreetMap (دول الخليج)
        run: |
          curl -sSL -o gcc.osm.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
          ls -lh gcc.osm.pbf
      - name: حدود المناطق
        run: |
          osmium tags-filter gcc.osm.pbf r/boundary=administrative -o adm.osm.pbf
          osmium export adm.osm.pbf -f geojsonseq --geometry-types=polygon -o adm.geojsonseq
          python3 scripts/regions.py adm.geojsonseq regions
      - name: بناء خريطة السعودية كاملة
        run: |
          set -o pipefail
          java -Xmx12g -jar planetiler.jar --osm-path=gcc.osm.pbf --output=saudi.pmtiles --download \
            --bounds=34.4,16.2,55.8,32.3 --maxzoom=14 --languages=ar,en --force 2>&1 | tee build.log
          ls -lh saudi.pmtiles
      - name: تقسيم المناطق
        run: |
          mkdir -p out
          if [ "$REGIONS" = "all" ]; then L=$(jq -r '.[].key' regions/_list.json); else L="$REGIONS"; fi
          for k in $L; do ./pmtiles extract saudi.pmtiles out/$k.pmtiles --region=regions/$k.geojson; done
          ls -lh out
      - name: الرفع على مخزن التطبيق (R2)
        run: |
          aws s3 cp s3://saudi-maps/index.json old-index.json --endpoint-url "$EP" || echo '{}' > old-index.json
          for f in out/*.pmtiles; do
            aws s3 cp "$f" "s3://saudi-maps/regions/$(basename $f)" --endpoint-url "$EP" --content-type application/octet-stream
          done
          python3 scripts/index.py old-index.json regions out
          aws s3 cp index.json s3://saudi-maps/index.json --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "max-age=3600"
          aws s3 rm s3://saudi-maps/test/hello.txt --endpoint-url "$EP" || true
          echo "## ✅ الخرائط جاهزة" >> $GITHUB_STEP_SUMMARY
          jq -r '.regions|to_entries[]|"- \(.value.name): \((.value.size/1048576*10|floor)/10) م.ب"' index.json >> $GITHUB_STEP_SUMMARY
      - name: حفظ السجل
        if: always()
        run: |
          mkdir -p /tmp/lg && cp *.log /tmp/lg/ 2>/dev/null || true
          echo "${{ job.status }} $(date -u +%FT%TZ)" > /tmp/lg/status.txt; df -h / >> /tmp/lg/status.txt; free -g >> /tmp/lg/status.txt
          cd /tmp/lg && for f in *.log; do [ -f "$f" ] && tail -300 "$f" > "t-$f"; done; rm -f build.log
          git init -q && git checkout -q -b logs && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm log
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
