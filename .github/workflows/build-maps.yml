name: تجهيز خرائط المناطق
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "المناطق (مفصولة بمسافة) أو all"
        default: "asir"
  push:
    paths: ['.github/workflows/build-maps.yml', 'scripts/**']
  schedule:
    - cron: "17 2 3 * *"   # كل شهر يوم 3 الساعة 5:17 الفجر بتوقيت السعودية
concurrency: { group: maps, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      REGIONS: ${{ github.event.inputs.regions || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - name: تجهيز الأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool jq >/dev/null
          U=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest | jq -r '.assets[]|select(.name|test("Linux_x86_64"))|.browser_download_url')
          curl -sSL "$U" | tar xz pmtiles && ./pmtiles version || true
          EP="${{ secrets.R2_ENDPOINT }}"; EP=$(echo "$EP" | tr -d '[:space:]'); EP=${EP%/}; EP=${EP%/saudi-maps}; echo "EP=$EP" >> $GITHUB_ENV
      - name: حدود المناطق (من OpenStreetMap)
        run: |
          set -o pipefail
          curl -fsSL --retry 5 -o gcc.osm.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
          osmium tags-filter gcc.osm.pbf r/boundary=administrative -o adm.osm.pbf
          osmium export adm.osm.pbf -f geojsonseq --geometry-types=polygon -o adm.geojsonseq
          python3 scripts/regions.py adm.geojsonseq regions 2>&1 | tee build.log
          rm -f gcc.osm.pbf adm.osm.pbf adm.geojsonseq
      - name: أحدث نسخة من خريطة العالم (OpenStreetMap)
        run: |
          set -o pipefail
          B=$(curl -fsSL --retry 5 https://build-metadata.protomaps.dev/builds.json | jq -r '[.[]|select(.key|test("^[0-9]{8}\\.pmtiles$"))]|sort_by(.key)|last|.key')
          echo "SRC=https://build.protomaps.com/$B" >> $GITHUB_ENV; echo "BUILD=${B%.pmtiles}" >> $GITHUB_ENV
          echo "المصدر: $B" | tee -a build.log
          ./pmtiles show "https://build.protomaps.com/$B" 2>&1 | head -20 | tee -a build.log
      - name: قص المناطق
        run: |
          set -o pipefail
          mkdir -p out
          if [ "$REGIONS" = "all" ]; then L=$(jq -r '.[].key' regions/_list.json); else L="$REGIONS"; fi
          for k in $L; do
            echo "== $k" | tee -a build.log
            ./pmtiles extract "$SRC" out/$k.pmtiles --region=regions/$k.geojson --download-threads=8 2>&1 | tail -5 | tee -a build.log
          done
          ls -lh out | tee -a build.log
      - name: الرفع على مخزن التطبيق (R2)
        run: |
          set -o pipefail
          aws s3 cp s3://saudi-maps/index.json old-index.json --endpoint-url "$EP" || echo '{}' > old-index.json
          for f in out/*.pmtiles; do
            aws s3 cp "$f" "s3://saudi-maps/regions/$(basename $f)" --endpoint-url "$EP" --content-type application/octet-stream --only-show-errors
          done
          python3 scripts/index.py old-index.json regions out "$BUILD" | tee -a build.log
          aws s3 cp index.json s3://saudi-maps/index.json --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "max-age=3600"
          aws s3 rm s3://saudi-maps/test/hello.txt --endpoint-url "$EP" || true
          cp index.json index.public.json
          echo "## ✅ الخرائط جاهزة" >> $GITHUB_STEP_SUMMARY
          jq -r '.regions|to_entries[]|"- \(.value.name): \((.value.size/1048576*10|floor)/10) م.ب"' index.json >> $GITHUB_STEP_SUMMARY
      - name: حفظ السجل
        if: always()
        run: |
          mkdir -p /tmp/lg && cp *.log index.public.json /tmp/lg/ 2>/dev/null || true
          echo "${{ job.status }} $(date -u +%FT%TZ)" > /tmp/lg/status.txt; df -h / >> /tmp/lg/status.txt
          cd /tmp/lg && git init -q && git checkout -q -b logs && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm log
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
