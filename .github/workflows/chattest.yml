name: فحص قواعد الشات
on:
  push:
    paths: ['tests/chat/**', '.github/workflows/chattest.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          cd tests/chat && npm i --silent
          for w in namas hiksa; do echo "=== $w"; npx firebase emulators:exec --only firestore --project demo-$w "node test.mjs $w" 2>&1 | grep -E "^(OK|FAIL)|Error" ; done
