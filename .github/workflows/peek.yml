name: نسخة ملف أماكن للفحص
on:
  push:
    paths: ['.github/workflows/peek.yml']
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - run: |
          mkdir out && aws s3 cp s3://saudi-maps/pois/makkah.json out/makkah.json --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          ls -lh out
          cd out && git init -q && git checkout -q -b peek && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm p
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" peek
